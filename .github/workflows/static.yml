name: Build Godot Browser Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            python3

      - name: Install Godot 4.5.2
        run: |
          set -euxo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo mv \
            /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 \
            /usr/local/bin/godot

          sudo chmod +x /usr/local/bin/godot

          godot --version

      - name: Install Godot Web export templates
        run: |
          set -euxo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz \
            -O /tmp/godot_templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/4.5.2.stable

          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates

          cp -r \
            /tmp/godot_templates/templates/* \
            ~/.local/share/godot/export_templates/4.5.2.stable/

          ls -la ~/.local/share/godot/export_templates/4.5.2.stable

      - name: Configure project for Web Compatibility renderer
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("project/project.godot")
          text = path.read_text()

          # Web builds use the Compatibility renderer.
          text = re.sub(
              r'rendering_method="[^"]*"',
              'rendering_method="gl_compatibility"',
              text
          )

          # FSR2 requires Forward+, so disable it for this Web build.
          # Godot scaling mode 0 = Bilinear.
          text = re.sub(
              r'scaling_3d/mode\s*=\s*2',
              'scaling_3d/mode=0',
              text
          )

          # Catch the fully-qualified form too.
          text = re.sub(
              r'rendering/scaling_3d/mode\s*=\s*2',
              'rendering/scaling_3d/mode=0',
              text
          )

          path.write_text(text)

          print("Web rendering settings:")
          for line in text.splitlines():
              if (
                  "rendering_method" in line
                  or "scaling_3d" in line
              ):
                  print(line)
          PY

      - name: Import Godot project
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --rendering-method gl_compatibility \
            --path project \
            --import

      - name: Build Web export
        run: |
          set -euxo pipefail

          rm -rf project/build/web
          mkdir -p project/build/web

          godot \
            --headless \
            --verbose \
            --rendering-method gl_compatibility \
            --path project \
            --export-release "Web" build/web/index.html

          echo "Export complete."
          echo "Generated files:"
          find project/build/web -maxdepth 2 -type f -print

          test -f project/build/web/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
