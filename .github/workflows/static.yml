name: Build Godot Browser Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.2
  TPS_COMMIT: 90f2e38d7b5cf9e6fd0b788d0da1df4b84d49269

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Drylands overlay
        uses: actions/checkout@v6

      - name: Validate overlay
        run: python3 tools/self_test.py

      - name: Assemble pinned official Godot TPS foundation
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf project
          git init project
          git -C project remote add origin https://github.com/godotengine/tps-demo.git
          git -C project fetch --depth 1 origin "$TPS_COMMIT"
          git -C project checkout --detach FETCH_HEAD
          python3 tools/install_overlay.py project

      - name: Install Godot and Web export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo ln -sf "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          curl -L --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          rm -rf "$RUNNER_TEMP/templates"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Import Godot resources
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path project --editor --quit-after 45

      - name: Export WebGL 2 browser build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf project/build/web
          mkdir -p project/build/web
          godot --headless --path project --export-release "Web" build/web/index.html
          test -s project/build/web/index.html
          test -s project/build/web/index.wasm
          test -s project/build/web/index.pck
          touch project/build/web/.nojekyll
          ls -lh project/build/web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: project/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Godot build to Pages
        id: deployment
        uses: actions/deploy-pages@v4
