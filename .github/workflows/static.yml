name: Build Godot Browser Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.2
  TPS_COMMIT: 90f2e38d7b5cf9e6fd0b788d0da1df4b84d49269

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Drylands overlay
        uses: actions/checkout@v6

      - name: Install CI prerequisites
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            git \
            curl \
            unzip \
            fontconfig \
            libfontconfig1 \
            libfreetype6 \
            fonts-dejavu-core

          python3 --version
          git --version
          fc-list | head -5 || true

      - name: Validate Drylands overlay
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/self_test.py

      - name: Install official Godot 4.5.2
        shell: bash
        run: |
          set -euxo pipefail

          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"

          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o "$GODOT_ZIP"

          rm -rf "$GODOT_DIR"
          mkdir -p "$GODOT_DIR"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"

          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          test -x "$GODOT_BIN" || chmod +x "$GODOT_BIN"

          echo "$GODOT_DIR" >> "$GITHUB_PATH"

          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot

          godot --version

      - name: Install official Web export templates
        shell: bash
        run: |
          set -euxo pipefail

          TEMPLATE_ARCHIVE="$RUNNER_TEMP/templates.tpz"
          TEMPLATE_UNPACK="$RUNNER_TEMP/templates-unpack"
          TEMPLATE_DST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$TEMPLATE_ARCHIVE"

          rm -rf "$TEMPLATE_UNPACK" "$TEMPLATE_DST"
          mkdir -p "$TEMPLATE_UNPACK" "$TEMPLATE_DST"

          unzip -q "$TEMPLATE_ARCHIVE" -d "$TEMPLATE_UNPACK"

          if [ -d "$TEMPLATE_UNPACK/templates" ]; then
            cp -a "$TEMPLATE_UNPACK/templates/." "$TEMPLATE_DST/"
          else
            echo "Unexpected export template archive layout:"
            find "$TEMPLATE_UNPACK" -maxdepth 2 -type f -print | sort | head -100
            exit 1
          fi

          echo "--- Installed Web templates ---"
          find "$TEMPLATE_DST" \
            -maxdepth 1 \
            -type f \
            -name 'web*.zip' \
            -printf '%f %s bytes\n' \
            | sort

          test -s "$TEMPLATE_DST/web_nothreads_release.zip"
          test -s "$TEMPLATE_DST/version.txt"

      - name: Assemble pinned official Godot TPS foundation
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project

          git init project
          git -C project remote add origin https://github.com/godotengine/tps-demo.git
          git -C project fetch --depth 1 origin "$TPS_COMMIT"
          git -C project checkout --detach FETCH_HEAD

          python3 tools/install_overlay.py project

          echo "--- Browser export preset ---"
          cat project/export_presets.cfg

          echo "--- Final renderer settings ---"
          grep -nE \
            'rendering_method|scaling_3d|hdr_2d|request_hdr_output|run_on_separate_thread' \
            project/project.godot || true

          if grep -q '^scaling_3d/mode=2$' project/project.godot; then
            echo "ERROR: FSR2 is still enabled in the assembled project."
            exit 1
          fi

          grep -q '^scaling_3d/mode=0$' project/project.godot
          grep -q '^renderer/rendering_method="gl_compatibility"$' project/project.godot

      - name: Create clean Godot editor cache
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/godot-config" "$RUNNER_TEMP/godot-cache"
          mkdir -p "$RUNNER_TEMP/godot-config" "$RUNNER_TEMP/godot-cache"

          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/godot-config" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/godot-cache" >> "$GITHUB_ENV"

      - name: Import Godot resources
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --rendering-method gl_compatibility \
            --path project \
            --editor \
            --quit-after 120

          echo "--- Import cache summary ---"
          du -sh project/.godot || true
          find project/.godot/imported -type f 2>/dev/null | wc -l || true

      - name: Export WebGL 2 browser build
        shell: bash
        run: |
          set -uo pipefail

          rm -rf project/build/web
          mkdir -p project/build/web

          echo "--- Memory before export ---"
          free -h || true

          set +e

          timeout 25m godot \
            --headless \
            --verbose \
            --rendering-method gl_compatibility \
            --path project \
            --export-release "Web" \
            build/web/index.html \
            2>&1 | tee "$RUNNER_TEMP/godot-web-export.log"

          GODOT_EXIT=${PIPESTATUS[0]}

          set -e

          echo "Godot export exit code: $GODOT_EXIT"

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "--- Last 150 export-log lines ---"
            tail -150 "$RUNNER_TEMP/godot-web-export.log" || true

            echo "--- Memory after failure ---"
            free -h || true

            echo "--- Kernel OOM/crash messages, if accessible ---"
            dmesg 2>/dev/null \
              | grep -Ei 'out of memory|oom|killed process|segfault' \
              | tail -50 \
              || true

            exit "$GODOT_EXIT"
          fi

          echo "--- Exported files ---"
          find project/build/web \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          test -s project/build/web/index.html
          test -s project/build/web/index.wasm
          test -s project/build/web/index.pck

          touch project/build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: project/build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy Godot build to Pages
        id: deployment
        uses: actions/deploy-pages@v4
