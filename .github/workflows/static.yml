name: Build Godot Browser Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            python3

      - name: Install Godot 4.5.2
        run: |
          set -euxo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo mv \
            /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 \
            /usr/local/bin/godot

          sudo chmod +x /usr/local/bin/godot

          godot --version

      - name: Install Godot Web export templates
        run: |
          set -euxo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz \
            -O /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q \
            /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.5.2.stable"

          cp -r \
            /tmp/godot_templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.5.2.stable/"

          echo "Installed export templates:"
          ls -la \
            "$HOME/.local/share/godot/export_templates/4.5.2.stable"

      - name: Locate Godot project
        run: |
          set -euxo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name project.godot \
            -not -path '*/.git/*' \
            | head -n 1)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Could not find project.godot anywhere in the repository."
            echo
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "Found project.godot:"
          echo "$PROJECT_FILE"

          echo "Godot project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_FILE=$PROJECT_FILE" >> "$GITHUB_ENV"

      - name: Show project files
        run: |
          set -euxo pipefail

          echo "PROJECT_DIR=$PROJECT_DIR"

          find "$PROJECT_DIR" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -n 200

      - name: Configure Web-compatible rendering
        run: |
          set -euxo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PROJECT_FILE"])

          print(f"Editing: {path}")

          text = path.read_text(encoding="utf-8")

          # Force Compatibility renderer where these settings already exist.
          text = re.sub(
              r'(?m)^renderer/rendering_method="[^"]*"$',
              'renderer/rendering_method="gl_compatibility"',
              text
          )

          text = re.sub(
              r'(?m)^renderer/rendering_method\.mobile="[^"]*"$',
              'renderer/rendering_method.mobile="gl_compatibility"',
              text
          )

          # FSR2 is mode 2 and requires Forward+.
          # Mode 0 is Bilinear and works with Compatibility/Web.
          text = re.sub(
              r'(?m)^scaling_3d/mode\s*=\s*2\s*$',
              'scaling_3d/mode=0',
              text
          )

          text = re.sub(
              r'(?m)^rendering/scaling_3d/mode\s*=\s*2\s*$',
              'rendering/scaling_3d/mode=0',
              text
          )

          path.write_text(text, encoding="utf-8")

          print()
          print("Relevant rendering settings:")

          for line in text.splitlines():
              if (
                  "rendering_method" in line
                  or "scaling_3d" in line
                  or "renderer/" in line
              ):
                  print(line)
          PY

      - name: Verify export preset
        run: |
          set -euxo pipefail

          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg was not found."
            echo "Expected:"
            echo "$PROJECT_DIR/export_presets.cfg"
            exit 1
          fi

          echo "Export presets:"
          grep -E '^\[preset|^name=' \
            "$PROJECT_DIR/export_presets.cfg" \
            || true

          if ! grep -q 'name="Web"' "$PROJECT_DIR/export_presets.cfg"; then
            echo
            echo 'ERROR: No export preset named exactly "Web" exists.'
            echo
            echo "Your preset names are:"
            grep '^name=' "$PROJECT_DIR/export_presets.cfg" || true
            exit 1
          fi

      - name: Import Godot project
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --verbose \
            --rendering-method gl_compatibility \
            --path "$PROJECT_DIR" \
            --import

      - name: Build Web export
        run: |
          set -euxo pipefail

          EXPORT_DIR="$PROJECT_DIR/build/web"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          godot \
            --headless \
            --verbose \
            --rendering-method gl_compatibility \
            --path "$PROJECT_DIR" \
            --export-release "Web" \
            "$EXPORT_DIR/index.html"

          echo
          echo "Generated Web files:"
          find "$EXPORT_DIR" \
            -maxdepth 2 \
            -type f \
            -print

          if [ ! -f "$EXPORT_DIR/index.html" ]; then
            echo "ERROR: Godot exited without creating index.html."
            exit 1
          fi

          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
