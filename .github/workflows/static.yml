name: Build Godot Browser Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Diagnose checkout
        run: |
          set -euxo pipefail

          echo "=== GitHub context ==="
          echo "repository: $GITHUB_REPOSITORY"
          echo "ref: $GITHUB_REF"
          echo "sha: $GITHUB_SHA"
          echo "workspace: $GITHUB_WORKSPACE"

          echo
          echo "=== Git status ==="
          git status

          echo
          echo "=== Current branch ==="
          git branch --show-current || true

          echo
          echo "=== Current commit ==="
          git log -1 --oneline --decorate

          echo
          echo "=== All branches ==="
          git branch -a

          echo
          echo "=== Files tracked by this commit ==="
          git ls-tree -r --name-only HEAD | head -n 500

          echo
          echo "=== Files actually present ==="
          find "$GITHUB_WORKSPACE" \
            -not -path "$GITHUB_WORKSPACE/.git/*" \
            -type f \
            | sort \
            | head -n 500

      - name: Locate Godot project
        run: |
          set -euxo pipefail

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name project.godot \
            -not -path '*/.git/*' \
            | head -n 1)"

          if [ -z "$PROJECT_FILE" ]; then
            echo
            echo "===================================================="
            echo "ERROR: project.godot is not committed on this branch"
            echo "===================================================="
            echo
            echo "GitHub Actions cannot build files that are only"
            echo "stored on your computer."
            echo
            echo "Make sure the complete Godot project is committed"
            echo "and pushed to the branch running this workflow."
            echo

            echo "Current commit:"
            git log -1 --oneline --decorate

            echo
            echo "Tracked files:"
            git ls-tree -r --name-only HEAD

            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          echo "Found Godot project:"
          echo "$PROJECT_FILE"

          echo "PROJECT_FILE=$PROJECT_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y wget unzip python3

      - name: Install Godot 4.5.2
        run: |
          set -euxo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d /tmp/godot

          sudo mv \
            /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 \
            /usr/local/bin/godot

          sudo chmod +x /usr/local/bin/godot

          godot --version

      - name: Install Godot Web export templates
        run: |
          set -euxo pipefail

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz \
            -O /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q \
            /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.5.2.stable"

          cp -r \
            /tmp/godot_templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.5.2.stable/"

      - name: Configure Web-compatible rendering
        run: |
          set -euxo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PROJECT_FILE"])
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'(?m)^renderer/rendering_method="[^"]*"$',
              'renderer/rendering_method="gl_compatibility"',
              text
          )

          text = re.sub(
              r'(?m)^renderer/rendering_method\.mobile="[^"]*"$',
              'renderer/rendering_method.mobile="gl_compatibility"',
              text
          )

          text = re.sub(
              r'(?m)^scaling_3d/mode\s*=\s*2\s*$',
              'scaling_3d/mode=0',
              text
          )

          text = re.sub(
              r'(?m)^rendering/scaling_3d/mode\s*=\s*2\s*$',
              'rendering/scaling_3d/mode=0',
              text
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify Web export preset
        run: |
          set -euxo pipefail

          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg is missing."
            exit 1
          fi

          if ! grep -q 'name="Web"' "$PROJECT_DIR/export_presets.cfg"; then
            echo 'ERROR: No export preset named exactly "Web".'
            echo
            echo "Available presets:"
            grep '^name=' "$PROJECT_DIR/export_presets.cfg" || true
            exit 1
          fi

      - name: Import project
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --rendering-method gl_compatibility \
            --path "$PROJECT_DIR" \
            --import

      - name: Export Web build
        run: |
          set -euxo pipefail

          EXPORT_DIR="$PROJECT_DIR/build/web"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          godot \
            --headless \
            --verbose \
            --rendering-method gl_compatibility \
            --path "$PROJECT_DIR" \
            --export-release "Web" \
            "$EXPORT_DIR/index.html"

          test -f "$EXPORT_DIR/index.html"

          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Generated files:"
          find "$EXPORT_DIR" -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.EXPORT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
