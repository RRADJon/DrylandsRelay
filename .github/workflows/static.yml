name: Build Godot Browser Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.2
  TPS_COMMIT: 90f2e38d7b5cf9e6fd0b788d0da1df4b84d49269

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.5.2

    steps:
      - name: Checkout Drylands overlay
        uses: actions/checkout@v6

      - name: Install CI prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3
          python3 --version

      - name: Validate overlay
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/self_test.py

      - name: Prepare Godot export templates
        shell: bash
        run: |
          set -euxo pipefail

          DST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          SRC_EXPORT="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          SRC_LEGACY="/root/.local/share/godot/templates/${GODOT_VERSION}.stable"

          mkdir -p "$HOME/.local/share/godot/export_templates"
          rm -rf "$DST"

          if [ -d "$SRC_EXPORT" ]; then
            echo "Using export templates from $SRC_EXPORT"
            cp -a "$SRC_EXPORT" "$DST"
          elif [ -d "$SRC_LEGACY" ]; then
            echo "Using export templates from $SRC_LEGACY"
            cp -a "$SRC_LEGACY" "$DST"
          else
            echo "ERROR: Could not find Godot export templates."
            find /root/.local/share/godot -maxdepth 4 -type f -print 2>/dev/null | sort | head -200 || true
            exit 1
          fi

          godot --version

          echo "Installed template files:"
          find "$DST" -maxdepth 1 -type f -printf '%f\n' | sort

          test -s "$DST/web_nothreads_release.zip"

      - name: Assemble pinned official Godot TPS foundation
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project

          git init project
          git -C project remote add origin https://github.com/godotengine/tps-demo.git
          git -C project fetch --depth 1 origin "$TPS_COMMIT"
          git -C project checkout --detach FETCH_HEAD

          python3 tools/install_overlay.py project

          echo "--- Browser export preset ---"
          cat project/export_presets.cfg

          echo "--- Browser renderer settings ---"
          grep -E 'rendering_method|request_hdr_output|run_on_separate_thread' \
            project/project.godot || true

      - name: Import Godot resources
        shell: bash
        run: |
          set -euxo pipefail

          godot \
            --headless \
            --verbose \
            --rendering-method gl_compatibility \
            --path project \
            --editor \
            --quit-after 45

      - name: Export WebGL 2 browser build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf project/build/web
          mkdir -p project/build/web

          godot \
            --headless \
            --verbose \
            --rendering-method gl_compatibility \
            --path project \
            --export-release "Web" \
            build/web/index.html

          echo "--- Exported files ---"

          find project/build/web \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          test -s project/build/web/index.html
          test -s project/build/web/index.wasm
          test -s project/build/web/index.pck

          touch project/build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: project/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy Godot build to Pages
        id: deployment
        uses: actions/deploy-pages@v4
